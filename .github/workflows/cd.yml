name: cd-dev-wf

on:
  push:
    branches:
      - develop

jobs:
  deploy-dev-job:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Trigger Render Deployment
        run: curl -X GET ${{ secrets.RENDER_CALLBACK_URL }}