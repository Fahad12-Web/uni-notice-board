name: CI Pipeline

on:
  push:
    branches:
      - develop

jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Linting step completed"

  app-build-job:
    needs: linting-job
    runs-on: ubuntu-latest
    steps:
      - run: echo "Application build completed"

  image-build-job:
    needs: app-build-job
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docker image build completed"